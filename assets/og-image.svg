<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Latar -->
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1F2733"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.7">
      <stop offset="0%" stop-color="#1447E6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C82FF"/>
      <stop offset="100%" stop-color="#1447E6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#bar)"/>

  <!-- Logo kiri atas -->
  <text x="90" y="84" font-family="'Courier New', ui-monospace, monospace" font-size="26" letter-spacing="2" fill="#8C96A3">~/M.Rezy</text>

  <!-- Blok teks kiri -->
  <text x="90" y="210" font-family="'Courier New', ui-monospace, monospace" font-size="26" letter-spacing="5" fill="#4C82FF">SOFTWARE DEVELOPER — PORTFOLIO</text>
  <text x="88" y="330" font-family="'Arial Black', 'Segoe UI', sans-serif" font-weight="900" font-size="104" fill="#F5F7FA">M.Rezy</text>
  <text x="90" y="430" font-family="'Arial Black', 'Segoe UI', sans-serif" font-weight="900" font-size="104" fill="#F5F7FA">Alfarabi</text>

  <!-- Chip teknologi -->
  <g font-family="'Courier New', ui-monospace, monospace" font-size="22" fill="#8C96A3">
    <rect x="90" y="470" width="150" height="46" rx="23" fill="none" stroke="#1F2733" stroke-width="2"/>
    <text x="165" y="500" text-anchor="middle">PHP</text>
    <rect x="256" y="470" width="170" height="46" rx="23" fill="none" stroke="#1F2733" stroke-width="2"/>
    <text x="341" y="500" text-anchor="middle">Flutter</text>
    <rect x="442" y="470" width="140" height="46" rx="23" fill="none" stroke="#1F2733" stroke-width="2"/>
    <text x="512" y="500" text-anchor="middle">Dart</text>
    <rect x="598" y="470" width="200" height="46" rx="23" fill="none" stroke="#1F2733" stroke-width="2"/>
    <text x="698" y="500" text-anchor="middle">JavaScript</text>
    <rect x="814" y="470" width="150" height="46" rx="23" fill="none" stroke="#1F2733" stroke-width="2"/>
    <text x="889" y="500" text-anchor="middle">HTML</text>
    <rect x="980" y="470" width="140" height="46" rx="23" fill="none" stroke="#1F2733" stroke-width="2"/>
    <text x="1050" y="500" text-anchor="middle">CSS</text>
  </g>

  <!-- Jendela terminal kanan -->
  <g transform="translate(820, 130)">
    <rect width="290" height="250" rx="12" fill="#121826" stroke="#1F2733" stroke-width="2"/>
    <rect width="290" height="42" rx="12" fill="#0B0F14"/>
    <rect y="40" width="290" height="2" fill="#1F2733"/>
    <circle cx="28" cy="21" r="6" fill="#1F2733"/>
    <circle cx="50" cy="21" r="6" fill="#1F2733"/>
    <circle cx="72" cy="21" r="6" fill="#1F2733"/>
    <text x="120" y="27" font-family="'Courier New', ui-monospace, monospace" font-size="15" fill="#8C96A3">~/start.sh</text>

    <text x="22" y="86" font-family="'Courier New', ui-monospace, monospace" font-size="19" fill="#4C82FF">~/portfolio $</text>
    <text x="250" y="86" font-family="'Courier New', ui-monospace, monospace" font-size="19" fill="#F5F7FA">whoami</text>
    <text x="22" y="120" font-family="'Courier New', ui-monospace, monospace" font-size="19" fill="#4C82FF">M.Rezy Alfarabi</text>
    <text x="22" y="158" font-family="'Courier New', ui-monospace, monospace" font-size="19" fill="#4C82FF">~/portfolio $</text>
    <text x="250" y="158" font-family="'Courier New', ui-monospace, monospace" font-size="19" fill="#F5F7FA">./status.sh</text>
    <text x="22" y="192" font-family="'Courier New', ui-monospace, monospace" font-size="18" fill="#8C96A3">role: </text>
    <text x="90" y="192" font-family="'Courier New', ui-monospace, monospace" font-size="18" fill="#F5F7FA">Software Developer</text>
    <text x="22" y="222" font-family="'Courier New', ui-monospace, monospace" font-size="18" fill="#8C96A3">status: </text>
    <text x="90" y="222" font-family="'Courier New', ui-monospace, monospace" font-size="18" fill="#4C82FF">open to collaboration</text>
  </g>

  <!-- Baris bawah -->
  <rect x="0" y="600" width="1200" height="30" fill="#0B0F14"/>
  <text x="90" y="556" font-family="'Courier New', ui-monospace, monospace" font-size="22" fill="#4C82FF">$ npm install kesuksesan</text>
  <text x="1110" y="556" text-anchor="end" font-family="'Courier New', ui-monospace, monospace" font-size="22" fill="#8C96A3">portofolio by devick404</text>
</svg>
