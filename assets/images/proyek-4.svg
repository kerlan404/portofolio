  <!-- dino piksel (biru) -->
  <g fill="#4C82FF">
    <rect x="128" y="276" width="18" height="6"/>
    <rect x="122" y="282" width="24" height="6"/>
    <rect x="116" y="288" width="30" height="6"/>
    <rect x="116" y="294" width="36" height="6"/>
    <rect x="110" y="300" width="42" height="6"/>
    <rect x="116" y="306" width="36" height="6"/>
    <rect x="116" y="312" width="18" height="6"/>
    <rect x="110" y="318" width="24" height="6"/>
    <rect x="110" y="324" width="18" height="6"/>
    <rect x="110" y="330" width="12" height="6"/>
    <rect x="128" y="330" width="6" height="6"/>
    <rect x="110" y="336" width="6" height="6"/>
