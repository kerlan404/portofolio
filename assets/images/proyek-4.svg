<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="JetBrains Mono, monospace">
  <rect width="800" height="500" fill="#0B0F14"/>

  <!-- navbar mini -->
