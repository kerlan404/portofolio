  <!-- ticker bawah -->
  <rect x="40" y="430" width="720" height="40" fill="#121826"/>
  <text x="50" y="456" fill="#8C96A3" font-size="12" letter-spacing="1">$ npm install kesuksesan ✦ 404: rasa takut tidak ditemukan ✦ git commit -m "rapi"</text>
