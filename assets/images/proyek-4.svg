  <g fill="#F5F7FA">
    <rect x="352" y="336" width="12" height="6"/>
    <rect x="346" y="342" width="24" height="6"/>
    <rect x="340" y="348" width="36" height="6"/>
    <rect x="340" y="354" width="12" height="6"/>
    <rect x="364" y="354" width="12" height="6"/>
    <rect x="340" y="360" width="36" height="6"/>
